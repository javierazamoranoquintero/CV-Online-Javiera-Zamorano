<form id="contact-form" method="POST" class="space-y-6">
    <input type="hidden" name="_subject" value="Nuevo mensaje desde tu CV Online" />
    <input type="hidden" name="_template" value="table" />
    <input type="hidden" name="_captcha" value="true" />

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
            <label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider ml-1" for="nombre">Nombre</label>
            <input
                    id="nombre"
                    name="nombre"
                    type="text"
                    autocomplete="name"
                    required
                    placeholder="Tu nombre"
                    class="w-full px-4 py-3 rounded bg-surface-container-low border border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-on-surface"
            />
        </div>
        <div class="space-y-2">
            <label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider ml-1" for="email">Email</label>
            <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                    placeholder="tu@email.com"
                    class="w-full px-4 py-3 rounded bg-surface-container-low border border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-on-surface"
            />
        </div>
    </div>
    <div class="space-y-2">
        <label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider ml-1" for="mensaje">Mensaje</label>
        <textarea
                id="mensaje"
                name="mensaje"
                rows="4"
                required
                placeholder="¿En qué puedo ayudarte?"
                class="w-full px-4 py-3 rounded bg-surface-container-low border border-outline-variant/30 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-on-surface resize-none"
        ></textarea>
    </div>
    <button
            type="submit"
            class="w-full bg-primary text-on-primary py-4 rounded-full font-label-caps text-label-caps uppercase tracking-widest hover:bg-primary-container hover:text-on-primary-container transition-all duration-300 transform hover:scale-[1.02] shadow-md flex items-center justify-center gap-2 group"
    >
        Enviar Mensaje
        <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">send</span>
    </button>
</form>
