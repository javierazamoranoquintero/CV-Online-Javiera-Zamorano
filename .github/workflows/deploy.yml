name: Deploy a GitHub Pages

# Se ejecuta automáticamente cada vez que subes cambios a "main".
on:
  push:
    branches: [main]

# Permite que la Action escriba en el repositorio (para crear/actualizar
# la rama gh-pages).
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar pnpm (misma versión que usamos localmente)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar (genera la carpeta dist/)
        run: pnpm build

      - name: Publicar dist/ en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist